<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Syne:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --accent: #F59E0B;
  --bg: #08080a;
  --bg-card: #111113;
  --text: #f5f5f4;
  --text-muted: #a1a1aa;
  --border: #27272a;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'DM Sans', sans-serif;
  background: #1a1a1a;
  color: var(--text);
}

.page {
  width: 210mm;
  min-height: 297mm;
  background: var(--bg);
  position: relative;
  overflow: hidden;
  page-break-after: always;
  margin: 20px auto;
}

.page:last-child { page-break-after: auto; }

.page-num {
  position: absolute;
  bottom: 12mm;
  right: 16mm;
  font-size: 9px;
  color: var(--text-muted);
  letter-spacing: 2px;
  font-family: 'Syne', sans-serif;
}

.section-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: var(--accent);
  font-family: 'Syne', sans-serif;
  margin-bottom: 8px;
}

.tag {
  display: inline-block;
  padding: 3px 10px;
  font-size: 10px;
  font-weight: 500;
  background: rgba(245,158,11,0.1);
  color: var(--accent);
  border: 1px solid rgba(245,158,11,0.25);
  border-radius: 3px;
  margin-right: 6px;
  margin-bottom: 6px;
  letter-spacing: 0.3px;
}

.metric {
  display: inline-block;
  padding: 4px 12px;
  font-size: 11px;
  font-weight: 700;
  background: var(--accent);
  color: var(--bg);
  border-radius: 3px;
  margin-right: 8px;
  margin-bottom: 6px;
  letter-spacing: 0.5px;
  font-family: 'Syne', sans-serif;
}

.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 20px;
}

.card-label {
  font-size: 9px;
  letter-spacing: 3px;
  color: var(--accent);
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  margin-bottom: 14px;
}

.keypoint {
  font-size: 12px;
  line-height: 1.7;
  color: var(--text);
  padding-left: 16px;
  position: relative;
  margin-bottom: 6px;
}

.keypoint-num {
  position: absolute;
  left: 0;
  color: var(--accent);
  font-weight: 700;
  font-size: 10px;
  font-family: 'Syne', sans-serif;
}

h2.work-title {
  font-size: 32px;
  font-weight: 800;
  font-family: 'Syne', sans-serif;
  margin: 4px 0 6px;
  letter-spacing: -0.5px;
  line-height: 1.15;
  color: var(--text);
}

.work-subtitle {
  font-size: 13px;
  color: var(--text-muted);
  letter-spacing: 0.5px;
}

.divider {
  width: 40px;
  height: 2px;
  background: var(--accent);
  margin-bottom: 24px;
}

.work-image {
  width: 100%;
  aspect-ratio: 16/9;
  background: linear-gradient(135deg, var(--bg-card) 0%, #1a1a1c 100%);
  border: 1px solid var(--border);
  border-radius: 4px;
  margin-bottom: 24px;
  overflow: hidden;
}

.work-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.work-desc {
  font-size: 13px;
  line-height: 1.9;
  color: var(--text-muted);
  margin-bottom: 24px;
  max-width: 540px;
}

.tech-label {
  font-size: 9px;
  letter-spacing: 3px;
  color: var(--text-muted);
  font-family: 'Syne', sans-serif;
  margin-bottom: 8px;
}

@media print {
  body { margin: 0; padding: 0; background: var(--bg); }
  @page { size: A4; margin: 0; }
  .page { margin: 0; box-shadow: none; }
  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
}
</style>
<script src="renderer.js" defer></script>
</head>
<body>

<!-- ==================== PAGE 1: COVER ==================== -->
<div class="page">
  <!-- Grid bg -->
  <div style="position:absolute;inset:0;background-image:linear-gradient(rgba(245,158,11,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(245,158,11,0.03) 1px,transparent 1px);background-size:40px 40px;"></div>
  <div style="position:absolute;top:0;right:0;width:180px;height:180px;background:linear-gradient(135deg,rgba(245,158,11,0.08) 0%,transparent 60%);"></div>
  <div style="position:absolute;bottom:0;left:0;width:300px;height:300px;background:radial-gradient(circle at bottom left,rgba(245,158,11,0.03) 0%,transparent 70%);"></div>

  <div style="padding:60mm 16mm 20mm 16mm;position:relative;height:100%;display:flex;flex-direction:column;">
    <!-- Top bar -->
    <div style="position:absolute;top:16mm;left:16mm;right:16mm;display:flex;justify-content:space-between;align-items:center;">
      <div id="cover-year" style="font-size:10px;letter-spacing:4px;color:var(--text-muted);font-family:'Syne',sans-serif;font-weight:700;"></div>
      <div style="width:40px;height:1px;background:linear-gradient(to right,var(--accent),transparent);"></div>
    </div>

    <!-- Name -->
    <div style="margin-bottom:12px;">
      <div id="cover-username" style="font-size:11px;letter-spacing:6px;color:var(--accent);font-family:'Syne',sans-serif;font-weight:700;margin-bottom:12px;"></div>
      <h1 id="cover-name" style="font-size:52px;font-weight:800;letter-spacing:-1px;line-height:1.05;font-family:'Syne',sans-serif;color:var(--text);"></h1>
    </div>

    <!-- Title -->
    <div id="cover-title" style="font-size:15px;color:var(--text-muted);letter-spacing:2px;font-family:'Syne',sans-serif;font-weight:500;margin-bottom:40px;padding-left:2px;"></div>

    <!-- Divider -->
    <div style="width:60px;height:2px;background:var(--accent);margin-bottom:40px;"></div>

    <!-- Philosophy -->
    <div id="cover-philosophy" style="font-size:14px;line-height:2;color:var(--text-muted);max-width:420px;margin-bottom:auto;"></div>

    <!-- Contact -->
    <div id="cover-contacts" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:400px;padding-top:30px;border-top:1px solid var(--border);"></div>
  </div>
</div>

<!-- ==================== WORKS (dynamically generated) ==================== -->
<div id="works-container"></div>

<!-- ==================== PAGE: SKILLS ==================== -->
<div class="page" style="padding:16mm;">
  <div class="section-label">SKILL SET</div>
  <h2 class="work-title">Skills & Tools</h2>
  <div style="height:30px;"></div>

  <!-- Skills grid -->
  <div id="skills-container" style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:36px;"></div>

  <!-- Education -->
  <div id="education-container" class="card" style="margin-bottom:36px;"></div>

  <!-- Bottom contact -->
  <div id="footer-contact" style="border-top:1px solid var(--border);padding-top:24px;display:flex;justify-content:space-between;align-items:flex-end;"></div>
  <div class="page-num"></div>
</div>

<!-- ==================== TEMPLATES ==================== -->

<!-- Standard work page template -->
<template id="tpl-work-standard">
  <div class="page" style="padding:16mm;">
    <div class="section-label" data-slot="section-label"></div>
    <h2 class="work-title" data-slot="title"></h2>
    <div class="work-subtitle" data-slot="subtitle"></div>
    <div style="height:24px;"></div>
    <div class="divider"></div>

    <div class="work-image" data-slot="image">
      <img src="" alt="">
    </div>

    <p class="work-desc" data-slot="description"></p>

    <div data-slot="metrics" style="margin-bottom:20px;"></div>

    <div class="card" style="margin-bottom:20px;">
      <div class="card-label">KEY POINTS</div>
      <div data-slot="keypoints"></div>
    </div>

    <div class="tech-label">TECH STACK</div>
    <div data-slot="techstack"></div>

    <div data-slot="link" style="margin-top:16px;font-size:11px;color:var(--accent);display:none;"></div>
    <div class="page-num"></div>
  </div>
</template>

<!-- Product grid work page template -->
<template id="tpl-work-product-grid">
  <div class="page" style="padding:16mm;">
    <div class="section-label" data-slot="section-label"></div>
    <h2 class="work-title" data-slot="title"></h2>
    <div class="work-subtitle" data-slot="subtitle"></div>
    <div style="height:24px;"></div>
    <div class="divider"></div>

    <div data-slot="product-grid" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:24px;"></div>

    <div data-slot="extra-cards"></div>

    <div data-slot="iterations"></div>

    <div data-slot="tags" style="margin-top:16px;"></div>
    <div class="page-num"></div>
  </div>
</template>

<noscript>
  <div style="padding:40px;text-align:center;color:#f5f5f4;font-family:sans-serif;">
    JavaScript is required. Please enable JavaScript to view this portfolio.
  </div>
</noscript>

</body>
</html>
